aid: audiomob
name: Audiomob
description: >-
  Audiomob is an in-game and in-app audio advertising platform that lets mobile game
  and app publishers monetize their titles with non-interruptive, skippable and
  rewarded audio ads while advertisers reach engaged gaming audiences at scale.
  Publishers integrate through the Audiomob Unity plugin or native iOS and Android
  SDKs (plus a community React Native adapter), add their games to the Audiomob
  developer dashboard, and configure ad units, an Ad Availability API, and
  server-to-server webhooks for reward and event tracking. The platform is Open
  Measurement (IAB Tech Lab) compliant, supports consent management via OneTrust and
  Sourcepoint, exposes Impression Level Revenue Data (ILRD), and integrates with
  mediation partners such as AdMob and LevelPlay (MAX) and mobile measurement
  partners including Adjust, Singular and Tenjin. The current SDK line is SDK 10.
  Audiomob is backed by Lightspeed Venture Partners.
